<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P2P 封面 v1</title>
<style>
  /* ============ P2P 真实 GUI 调色板（来自 P2PGuiTextures.java） ============ */
  :root {
    --ink:      #E6E6E6;
    --ink-dim:  #9AA0A6;
    --title:    #E8E8E8;
    --tab-bg:   #262A30;
    --row-bg:   #2C3138;
    --row-bg2:  #333941;
    --sel:      #3C4350;
    --grp-bg:   #363C45;
    --sep:      #1E2228;
    --faux-btn: #3A4150;
    --faux-hi:  #565E6B;
    --faux-sh:  #14171C;
    --gold:     #D6B24A;
    --danger:   #E06B6B;
    --ok:       #5FC35F;
    --panel-bg: #23272E;
    --field-bg: #1A1D22;
    --btn-hi:   #4A5364;
    --btn-off:  #2A2F37;
    --btn-sel:  #3D5C8C;
    --btn-sel-hi:#4E74AD;
    --accent:   #8FB8F0;
    --knob:     #6B7482;
    --in-c:     #d93a3a;   /* INPUT 红 */
    --out-c:    #3a7ad9;   /* OUTPUT 蓝 */
    --item-c:   #8a5a2b;   /* 物品棕 */
    --fluid-c:  #2f5aa8;   /* 流体蓝 */
    --energy-c: #9c3327;   /* 能量红 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    background: radial-gradient(1200px 800px at 78% 12%, #1d2430 0%, #14181f 45%, #0b0e13 100%);
    color: var(--ink);
    position: relative;
  }

  /* ---- 背景装饰：网格 + 斜光束 + 频道波纹 ---- */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(143,184,240,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(143,184,240,0.05) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(1000px 700px at 60% 40%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(1000px 700px at 60% 40%, #000 30%, transparent 75%);
  }
  .beams::before, .beams::after {
    content: ""; position: absolute; top: -20%; bottom: -20%;
    width: 340px; transform: rotate(18deg);
    background: linear-gradient(180deg, transparent, rgba(143,184,240,0.08) 50%, transparent);
  }
  .beams::before { left: 8%; }
  .beams::after  { right: 6%; transform: rotate(-14deg); background: linear-gradient(180deg, transparent, rgba(214,178,74,0.06) 50%, transparent); }

  .content { position: relative; z-index: 2; display: flex; height: 1080px; }

  /* ================= 左侧：标题区 ================= */
  .left {
    flex: 0 0 46%;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 0 0 110px;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 14px;
    font-size: 30px; letter-spacing: 6px; color: var(--accent);
    font-weight: 600; margin-bottom: 26px;
  }
  .eyebrow .bar { width: 64px; height: 6px; background: var(--accent); border-radius: 3px; box-shadow: 0 0 18px rgba(143,184,240,0.9); }
  .title-main {
    font-size: 218px; font-weight: 900; line-height: 1.02; letter-spacing: 6px;
    color: #fff;
    text-shadow: 0 0 60px rgba(143,184,240,0.35), 0 8px 0 rgba(0,0,0,0.55);
    margin-bottom: 18px;
  }
  .title-main .hl { color: var(--accent); }
  .title-sub {
    font-size: 52px; font-weight: 700; color: var(--ink);
    letter-spacing: 3px; margin-bottom: 44px;
  }
  .title-sub .dim { color: var(--ink-dim); font-weight: 400; }

  /* 媒介 chips：三种介质一条龙 */
  .media-row { display: flex; gap: 22px; }
  .chip {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 30px 14px 14px;
    background: var(--row-bg);
    border: 1px solid var(--faux-hi);
    border-radius: 12px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 6px 18px rgba(0,0,0,0.4);
  }
  .chip .dot { width: 22px; height: 22px; border-radius: 5px; }
  .chip .lbl { font-size: 30px; font-weight: 600; letter-spacing: 2px; }

  /* ================= 右侧：GUI 风示意面板 ================= */
  .right {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding-right: 70px; position: relative;
  }

  /* 传送门光环背景 */
  .portal-glow {
    position: absolute; right: 120px; top: 50%; transform: translateY(-50%);
    width: 560px; height: 560px; border-radius: 50%;
    background: radial-gradient(circle, rgba(143,184,240,0.13) 0%, rgba(61,92,140,0.10) 40%, transparent 68%);
    filter: blur(2px);
  }

  /* 主面板 — 模拟 ChannelScreen 频道详情 */
  .panel {
    width: 720px;
    background: var(--panel-bg);
    border: 1px solid var(--faux-hi);
    border-radius: 16px;
    box-shadow: 0 0 0 1px var(--faux-sh), 0 30px 80px rgba(0,0,0,0.65), 0 0 120px rgba(61,92,140,0.25);
    overflow: hidden;
    transform: perspective(1600px) rotateY(-4deg) rotateX(1.5deg);
    animation: float 5s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: perspective(1600px) rotateY(-4deg) rotateX(1.5deg) translateY(0); } 50% { transform: perspective(1600px) rotateY(-4deg) rotateX(1.5deg) translateY(-14px); } }

  .panel .p-head {
    background: var(--tab-bg);
    padding: 20px 26px;
    display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid var(--faux-sh);
  }
  .panel .p-head .tag {
    font-size: 24px; color: var(--ink-dim); letter-spacing: 2px;
    background: var(--field-bg); padding: 6px 16px; border-radius: 8px;
    border: 1px solid var(--faux-sh);
  }
  .panel .p-head .ch-name { font-size: 34px; font-weight: 700; color: var(--title); }
  .panel .p-head .type-bar { width: 8px; height: 40px; border-radius: 4px; margin-left: auto; background: var(--item-c); box-shadow: 0 0 16px rgba(138,90,43,0.8); }

  .panel .p-body { padding: 30px 26px 26px; }

  /* 端点行 */
  .ep {
    display: flex; align-items: center; gap: 20px;
    background: var(--row-bg); border: 1px solid var(--sep);
    border-radius: 12px; padding: 20px 24px; margin-bottom: 16px;
  }
  .ep .role-badge {
    width: 132px; text-align: center;
    font-size: 26px; font-weight: 800; letter-spacing: 2px;
    padding: 10px 0; border-radius: 9px; flex: none;
  }
  .ep.in  .role-badge { background: rgba(217,58,58,0.16); color: #ff7d7d; border: 1px solid rgba(217,58,58,0.55); }
  .ep.out .role-badge { background: rgba(58,122,217,0.16); color: #7db0ff; border: 1px solid rgba(58,122,217,0.55); }
  .ep .box-ico {
    width: 74px; height: 74px; border-radius: 14px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 900;
  }
  .ep.in .box-ico  { background: linear-gradient(145deg, #3a3328, #241f17); border: 2px solid #6b4a20; color: #c9a06a; }
  .ep.out .box-ico { background: linear-gradient(145deg, #38243f, #1d1324); border: 2px solid #7b2fd0; color: #c77dff; }
  .ep .meta { flex: 1; }
  .ep .meta .t1 { font-size: 30px; font-weight: 700; letter-spacing: 1px; }
  .ep .meta .t2 { font-size: 23px; color: var(--ink-dim); margin-top: 6px; letter-spacing: 1px; }
  .ep .dim-pill {
    font-size: 22px; color: var(--ink); background: var(--field-bg);
    border: 1px solid var(--faux-sh); padding: 8px 18px; border-radius: 999px;
    display: flex; align-items: center; gap: 10px; flex: none;
  }
  .ep .dim-pill .glow { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .ep.out .dim-pill .glow { background: #b06ae0; box-shadow: 0 0 10px #b06ae0; }

  /* 中间：无线传输符号 */
  .wireless {
    display: flex; align-items: center; gap: 14px;
    padding: 6px 10px; margin: 2px 0 18px;
  }
  .wireless .wl-label {
    font-size: 22px; color: var(--gold); letter-spacing: 3px; font-weight: 700;
    background: rgba(214,178,74,0.10); border: 1px solid rgba(214,178,74,0.4);
    padding: 6px 18px; border-radius: 999px; flex: none;
  }
  .wave {
    flex: 1; height: 46px; position: relative; overflow: hidden;
  }
  .wave .arc { position: absolute; border: 3px solid var(--accent); border-radius: 50%; opacity: 0; }
  .wave .arc:nth-child(1) { left: 0%;  width: 44px; height: 44px; animation: waveL 1.6s infinite; }
  .wave .arc:nth-child(2) { left: 12%; width: 44px; height: 44px; animation: waveL 1.6s 0.22s infinite; }
  .wave .arc:nth-child(3) { left: 24%; width: 44px; height: 44px; animation: waveL 1.6s 0.44s infinite; }
  .wave .arc:nth-child(4) { left: 36%; width: 44px; height: 44px; animation: waveL 1.6s 0.66s infinite; }
  .wave .arc:nth-child(5) { left: 48%; width: 44px; height: 44px; animation: waveL 1.6s 0.88s infinite; }
  .wave .arc:nth-child(6) { left: 60%; width: 44px; height: 44px; animation: waveL 1.6s 1.10s infinite; }
  .wave .arc:nth-child(7) { left: 72%; width: 44px; height: 44px; animation: waveL 1.6s 1.32s infinite; }
  .wave .arc:nth-child(8) { left: 84%; width: 44px; height: 44px; animation: waveL 1.6s 1.54s infinite; }
  @keyframes waveL {
    0%   { transform: scale(0.25); opacity: 0; }
    15%  { opacity: 0.9; }
    100% { transform: scale(1); opacity: 0; }
  }

  /* 底部信息条 */
  .p-foot {
    display: flex; align-items: center; gap: 26px;
    background: var(--tab-bg); padding: 18px 26px;
    border-top: 1px solid var(--faux-sh);
  }
  .stat { display: flex; align-items: center; gap: 12px; }
  .stat .v { font-size: 32px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 21px; color: var(--ink-dim); letter-spacing: 1px; }
  .p-foot .spacer { flex: 1; }
  .badge-cd { font-size: 21px; color: var(--ok); letter-spacing: 2px; display: flex; align-items: center; gap: 10px; }
  .badge-cd .chk { width: 26px; height: 26px; border-radius: 50%; background: var(--ok); display: flex; align-items: center; justify-content: center; font-size: 16px; color: #0b0e13; font-weight: 900; }

  /* ---- 角标 ---- */
  .corner-tag {
    position: absolute; z-index: 3;
    bottom: 44px; left: 110px;
    font-size: 24px; letter-spacing: 4px; color: rgba(230,230,230,0.75);
    display: flex; align-items: center; gap: 18px;
  }
  .corner-tag .sep-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-dim); }
  .p2p-emblem {
    position: absolute; z-index: 3; top: 50px; right: 90px;
    display: flex; align-items: center; gap: 14px;
    font-size: 26px; font-weight: 800; letter-spacing: 8px; color: var(--ink-dim);
  }
  .p2p-emblem .sq {
    width: 40px; height: 40px; border-radius: 9px;
    background: linear-gradient(145deg, var(--btn-sel), var(--btn-sel-hi));
    border: 1px solid var(--faux-hi);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #fff; font-weight: 900;
    box-shadow: 0 0 24px rgba(78,116,173,0.6);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="beams"></div>

  <div class="content">
    <!-- ========== 左侧标题 ========== -->
    <div class="left">
      <div class="eyebrow"><span class="bar"></span>P2P · 无线频道物流</div>
      <div class="title-main">告别<span class="hl">管道</span>！</div>
      <div class="title-sub">绑定即传 · <span class="dim">隔空直达</span></div>
      <div class="media-row">
        <div class="chip"><span class="dot" style="background:var(--item-c)"></span><span class="lbl">物品</span></div>
        <div class="chip"><span class="dot" style="background:var(--fluid-c)"></span><span class="lbl">流体</span></div>
        <div class="chip"><span class="dot" style="background:var(--energy-c)"></span><span class="lbl">能量</span></div>
      </div>
    </div>

    <!-- ========== 右侧 GUI 示意 ========== -->
    <div class="right">
      <div class="portal-glow"></div>
      <div class="panel">
        <div class="p-head">
          <span class="tag">频道 #1</span>
          <span class="ch-name">主基地干线</span>
          <span class="type-bar"></span>
        </div>
        <div class="p-body">
          <div class="ep in">
            <span class="role-badge">INPUT</span>
            <div class="box-ico">箱</div>
            <div class="meta">
              <div class="t1">箱子 A · 主世界</div>
              <div class="t2">绑定顶面 · 抽取端</div>
            </div>
            <span class="dim-pill"><span class="glow"></span>主世界</span>
          </div>

          <div class="wireless">
            <span class="wl-label">◈ 无线传输</span>
            <div class="wave">
              <span class="arc"></span><span class="arc"></span><span class="arc"></span>
              <span class="arc"></span><span class="arc"></span><span class="arc"></span>
              <span class="arc"></span><span class="arc"></span>
            </div>
          </div>

          <div class="ep out">
            <span class="role-badge">OUTPUT</span>
            <div class="box-ico">箱</div>
            <div class="meta">
              <div class="t1">箱子 B · 下界</div>
              <div class="t2">绑定顶面 · 注入端</div>
            </div>
            <span class="dim-pill"><span class="glow"></span>下界</span>
          </div>
        </div>
        <div class="p-foot">
          <div class="stat"><span class="v">512</span><span class="k">物品 / tick</span></div>
          <div class="stat"><span class="v">∞</span><span class="k">距离</span></div>
          <div class="spacer"></div>
          <div class="badge-cd"><span class="chk">✓</span>跨维度</div>
        </div>
      </div>
    </div>
  </div>

  <div class="p2p-emblem"><span class="sq">P</span>P2P</div>
  <div class="corner-tag">Forge 1.20.1 <span class="sep-dot"></span> 模组宣传片</div>
</body>
</html>
