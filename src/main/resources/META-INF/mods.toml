modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
displayTest="IGNORE_SERVER_VERSION"
logoFile="logo.png" 

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# JEI is optional: the filter editor's ghost-drag marking only activates when JEI is installed.
[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[15.20.0.106,)"
    ordering="NONE"
    side="CLIENT"
